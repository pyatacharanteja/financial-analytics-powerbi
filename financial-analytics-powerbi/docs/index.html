<div id="app"></div>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#18212f}#app{max-width:1180px;margin:0 auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}.hero h1{margin:0;font-size:30px;line-height:1.1}.hero p{margin:7px 0 0;color:#667085}.badge{background:#fff4e5;color:#8a4b00;border:1px solid #ffd39a;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.toolbar,.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 2px 10px rgba(15,23,42,.04)}.toolbar{padding:14px 16px;display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:180px}.field label{font-size:12px;font-weight:700;color:#667085;text-transform:uppercase;letter-spacing:.04em}.field select{height:42px;border:1px solid #d0d5dd;border-radius:10px;padding:0 12px;background:white;color:#18212f;font-size:14px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.card{padding:16px}.label{font-size:12px;color:#667085;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.value{font-size:28px;font-weight:800;margin-top:8px}.sub{font-size:12px;color:#98a2b3;margin-top:4px}.up{color:#087443}.down{color:#b42318}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.panel{padding:18px}.panel h2{font-size:16px;margin:0 0 14px}.chart-wrap{height:340px}.bars{display:flex;flex-direction:column;gap:12px}.bar-row{display:grid;grid-template-columns:60px 1fr 70px;gap:10px;align-items:center;font-size:13px}.bar-bg{height:9px;background:#eef2f6;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:#4462ff;border-radius:999px}.table-panel{margin-top:16px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #eef2f6}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#667085}.footer{margin-top:18px;color:#667085;font-size:12px;line-height:1.5}.empty{padding:30px;text-align:center;color:#667085}@media(max-width:820px){#app{padding:14px}.hero{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.chart-wrap{height:280px}}@media(max-width:480px){.kpis{grid-template-columns:1fr}.value{font-size:24px}.field{min-width:100%;width:100%}}
</style>
<script>
(async()=>{
 const root=document.getElementById('app');
 root.innerHTML='<div class="empty">Loading dashboard data…</div>';
 try{
  const text=await fetch('./data/market_data.csv').then(r=>{if(!r.ok)throw new Error('Data file unavailable');return r.text()});
  const lines=text.trim().split(/\r?\n/); const headers=lines[0].split(',');
  const rows=lines.slice(1).map(line=>{const a=line.split(',');return {Date:a[0],Ticker:a[1],Company:a[2],Sector:a[3],Close:+a[4],Volume:+a[5]}});
  const tickers=[...new Set(rows.map(d=>d.Ticker))];
  root.innerHTML=`<section class="hero"><div><h1>Financial Analytics Dashboard</h1><p>Interactive market-performance view built for GitHub Pages.</p></div><div class="badge">Demo dataset • UI prototype</div></section><section class="toolbar"><div class="field"><label>Ticker</label><select id="ticker"></select></div></section><section class="kpis"><div class="card"><div class="label">Latest Close</div><div class="value" id="latest">—</div><div class="sub">Last date in selection</div></div><div class="card"><div class="label">Period Return</div><div class="value" id="return">—</div><div class="sub">First to last observation</div></div><div class="card"><div class="label">Average Volume</div><div class="value" id="volume">—</div><div class="sub">Selected ticker</div></div><div class="card"><div class="label">Max Close</div><div class="value" id="max">—</div><div class="sub">Selected period</div></div></section><section class="grid"><div class="panel"><h2>Price Trend</h2><div class="chart-wrap"><svg id="chart" viewBox="0 0 760 330" width="100%" height="100%" role="img" aria-label="Price trend chart"></svg></div></div><div class="panel"><h2>Ticker Performance</h2><div id="bars" class="bars"></div></div></section><section class="panel table-panel"><h2>Latest Observations</h2><div class="table-scroll"><table><thead><tr><th>Date</th><th>Ticker</th><th>Company</th><th>Close</th><th>Volume</th></tr></thead><tbody id="tbody"></tbody></table></div></section><div class="footer"><strong>Data note:</strong> this GitHub Pages dashboard currently uses simulated demo market data for portfolio prototyping. It is not presented as live or historical market truth. The repository also contains Stooq Power Query and Yahoo Finance/yfinance pipelines for real-data workflows.</div>`;
  const select=document.getElementById('ticker'); tickers.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;select.appendChild(o)});
  function money(v){return '$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
  function compact(v){return new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(v)}
  function renderChart(data){const svg=document.getElementById('chart'); const W=760,H=330,p={l:52,r:18,t:16,b:38}; const vals=data.map(d=>d.Close); const min=Math.min(...vals),max=Math.max(...vals); const span=Math.max(1,max-min); const pts=data.map((d,i)=>{const x=p.l+i*(W-p.l-p.r)/Math.max(1,data.length-1); const y=p.t+(max-d.Close)*(H-p.t-p.b)/span; return [x,y]}); let html=''; for(let i=0;i<5;i++){const y=p.t+i*(H-p.t-p.b)/4; const val=max-i*span/4; html+=`<line x1="${p.l}" y1="${y}" x2="${W-p.r}" y2="${y}" stroke="#e9edf3"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#98a2b3">${val.toFixed(0)}</text>`} html+=`<polyline fill="none" stroke="#4462ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`; const labels=[0,Math.floor((data.length-1)/2),data.length-1]; labels.forEach(i=>{const x=pts[i][0];html+=`<text x="${x}" y="${H-10}" text-anchor="middle" font-size="11" fill="#98a2b3">${data[i].Date.slice(5)}</text>`}); svg.innerHTML=html}
  function renderBars(){const stats=tickers.map(t=>{const d=rows.filter(r=>r.Ticker===t).sort((a,b)=>a.Date.localeCompare(b.Date)); const ret=(d.at(-1).Close/d[0].Close-1)*100;return {t,ret}}).sort((a,b)=>b.ret-a.ret); const maxAbs=Math.max(...stats.map(s=>Math.abs(s.ret)),1); document.getElementById('bars').innerHTML=stats.map(s=>`<div class="bar-row"><strong>${s.t}</strong><div class="bar-bg"><div class="bar-fill" style="width:${Math.max(3,Math.abs(s.ret)/maxAbs*100)}%;background:${s.ret>=0?'#12b76a':'#f04438'}"></div></div><span class="${s.ret>=0?'up':'down'}">${s.ret>=0?'+':''}${s.ret.toFixed(2)}%</span></div>`).join('')}
  function render(){const t=select.value; const d=rows.filter(r=>r.Ticker===t).sort((a,b)=>a.Date.localeCompare(b.Date)); const first=d[0],last=d.at(-1); const ret=(last.Close/first.Close-1)*100; document.getElementById('latest').textContent=money(last.Close); const re=document.getElementById('return'); re.textContent=(ret>=0?'+':'')+ret.toFixed(2)+'%'; re.className='value '+(ret>=0?'up':'down'); document.getElementById('volume').textContent=compact(d.reduce((s,x)=>s+x.Volume,0)/d.length); document.getElementById('max').textContent=money(Math.max(...d.map(x=>x.Close))); renderChart(d); document.getElementById('tbody').innerHTML=d.slice(-10).reverse().map(x=>`<tr><td>${x.Date}</td><td><strong>${x.Ticker}</strong></td><td>${x.Company}</td><td>${money(x.Close)}</td><td>${x.Volume.toLocaleString()}</td></tr>`).join('')}
  renderBars(); render(); select.addEventListener('change',render);
 }catch(e){root.innerHTML='<div class="empty"><strong>Dashboard could not load.</strong><br>'+e.message+'</div>'}
})();
</script>
